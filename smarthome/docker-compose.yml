version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smarthome_db
    environment:
      POSTGRES_DB: ${DB_NAME:-smarthome_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smarthome_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend-python
      dockerfile: Dockerfile
    container_name: smarthome_backend
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      PORT: ${PORT:-5000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smarthome_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your_secret_key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081,http://localhost:3000}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - smarthome_network
    command: npm run dev

volumes:
  postgres_data:

networks:
  smarthome_network:
    driver: bridge
